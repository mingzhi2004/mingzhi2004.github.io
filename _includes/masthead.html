<header class="site-header">
  <div class="site-shell site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/images/icon.png' | relative_url }}" alt="" width="36" height="36">
      {{ site.name | escape }}
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      {% for link in site.data.navigation.main %}
        {% assign href = link.url %}
        {% unless href contains '://' %}{% assign href = href | relative_url %}{% endunless %}
        <a href="{{ href }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title | escape }}</a>
      {% endfor %}
    </nav>
    <button id="theme-toggle" class="site-theme-toggle" type="button" aria-label="Toggle light and dark theme">
      <i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i>
    </button>
  </div>
</header>
